<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor — microblog</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #FAFAF8;
    --fg: #1C1917;
    --muted: #9A9490;
    --accent: #CC785C;
    --border: #E8E4DF;
}

html {
    background: var(--bg);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 128px 28px 96px;
}

nav {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
}

.logo {
    width: 44px;
    height: auto;
    display: block;
}

nav .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: -0.015em;
    color: var(--fg);
}

.back {
    margin-bottom: 48px;
}

.back a {
    font-size: 14px;
    color: var(--muted);
}

a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
    transition: color 0.18s, border-color 0.18s;
}

a:hover {
    color: var(--accent);
    border-color: var(--accent);
}

.entries {
    display: flex;
    flex-direction: column;
    gap: 32px;
}

.entry {
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
}

.entry:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.entry-date {
    display: block;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.01em;
    margin-bottom: 8px;
}

.entry-text {
    font-size: 17px;
    line-height: 1.65;
}

.entry-text em {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 400;
}

.empty {
    color: var(--muted);
    font-size: 15px;
}

@media (max-width: 768px) {
    .container {
        padding: 80px 24px 72px;
    }
}
</style>
</head>
<body>
<div class="container">

    <nav>
        <img class="logo" src="logo.svg" alt="Victor">
        <span class="name">Victor</span>
    </nav>

    <p class="back"><a href="/">&larr; home</a></p>

    <main>
        <div class="entries" id="entries"></div>
    </main>

</div>

<script>
// Newest first. Add new entries at the top of this array.
const entries = [
    // { date: "2026-08-12", text: "first post here." },
];

const container = document.getElementById("entries");

if (entries.length === 0) {
    container.innerHTML = '<p class="empty">nothing here yet.</p>';
} else {
    container.innerHTML = entries.map(e => `
        <div class="entry">
            <span class="entry-date">${e.date}</span>
            <p class="entry-text">${e.text}</p>
        </div>
    `).join("");
}
</script>
</body>
</html>
