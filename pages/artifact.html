<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact — Victor Aguiar-Macedo</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="column">
  <nav class="top" data-base=".." data-page="artifacts"></nav>

  <main id="content"></main>
</div>

<script src="../projects.js"></script>
<script src="../js/site.js"></script>
<script>
/* A single file serves all 20: the address carries the id (artifact.html?id=soroban)
   and the page builds the rest from projects.js. */
const content = document.getElementById('content');
const id = new URLSearchParams(location.search).get('id');
const w = WORKS.find(x => x.id === id) || WORKS[0];

document.title = w.name + ' — Victor Aguiar-Macedo';

function block(label, text) {
  if (!text) return null;                  /* an empty field never becomes an empty heading */
  const div = document.createElement('div');
  div.className = 'block';
  const h = document.createElement('h2');
  h.className = 'label';
  h.textContent = label;
  const p = document.createElement('p');
  p.textContent = text;
  div.append(h, p);
  return div;
}

const back = document.createElement('a');
back.className = 'back';
back.href = 'artifacts.html';
back.textContent = '← artifacts';

const title = document.createElement('h1');
title.className = 'title';
title.textContent = w.name;

const meta = document.createElement('p');
meta.className = 'detail-meta';
meta.textContent = tagLabels(w).concat(stateLabel(w)).join(' · ');

const shot = document.createElement('img');
shot.className = 'detail-media';
shot.src = '../images/shots/' + w.id + '.jpg';
shot.alt = 'Screen from ' + w.name;

content.append(back, title, meta, shot);
[block('what it is', w.what),
 block('how it works', w.how),
 block('the decision', w.decision)].forEach(b => b && content.appendChild(b));
</script>
</body>
</html>
