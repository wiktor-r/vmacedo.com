<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 and 3 to square glyphs</title>
<style>
:root{--ink:#1d1d1f;--muted:#8a8a8e;--bg:#ffffff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ink:#ececec;--muted:#77777c;--bg:#151517}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:2rem 1rem}
main{width:100%;max-width:720px}
.c{display:flex;gap:12px;align-items:center;margin-bottom:1rem}
input{flex:1}button{font:inherit;padding:6px 14px;border:1px solid var(--muted);background:none;color:var(--ink);border-radius:6px;cursor:pointer}
#tl{font-size:13px;color:var(--muted);min-width:40px}
text{font:13px system-ui,sans-serif;fill:var(--muted)}
</style><link rel="canonical" href="https://vmacedo.com/play/digits/glyphs.html"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head><body><main>
<div class="c"><button id="play">Play</button><input type="range" id="t" min="0" max="1000" value="0" aria-label="Timeline"><span id="tl">0%</span></div>
<svg viewBox="0 0 640 230" width="100%" role="img" aria-label="4 and 3 transforming into glyphs and merging">
<g id="p0"></g><g id="p1" transform="translate(220,0)"></g><g id="p2" transform="translate(440,0)"></g>
<text x="100" y="222" text-anchor="middle">4 falls</text><text x="320" y="222" text-anchor="middle">3 inflates</text><text x="540" y="222" text-anchor="middle">4 over 3</text>
</svg></main>
<script>
const N=48,NS="http://www.w3.org/2000/svg";
function resample(p,n){const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));const T=L[L.length-1],o=[];let j=1;for(let k=0;k<n;k++){const d=T*k/(n-1);while(j<p.length-1&&L[j]<d)j++;const s=L[j]-L[j-1]||1,u=(d-L[j-1])/s;o.push([p[j-1][0]+(p[j][0]-p[j-1][0])*u,p[j-1][1]+(p[j][1]-p[j-1][1])*u]);}return o;}
function arc(cx,cy,r,a0,a1){const o=[];for(let i=0;i<=40;i++){const a=(a0+(a1-a0)*i/40)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
function quad(a,c,b){const o=[];for(let i=0;i<=40;i++){const t=i/40,m=1-t;o.push([m*m*a[0]+2*m*t*c[0]+t*t*b[0],m*m*a[1]+2*m*t*c[1]+t*t*b[1]]);}return o;}
const S=x=>resample(x,N);
const four=[{s:S([[125,170],[125,40]]),e:S([[160,160],[40,160],[40,40],[160,40],[160,160]])},{s:S([[125,40],[45,125]]),e:S([[158,42],[42,108]])},{s:S([[45,125],[150,125]]),e:S([[40,108],[160,108]])}];
const three=[{s:S(arc(98,70,30,-150,90)),e:S([[40,40],[160,40],[160,160],[40,160],[40,40]])},{s:S(arc(98,135,35,-90,150)),e:S(quad([152,45],[150,158],[45,150]))}];
const eIn=x=>x*x*x,eQ=x=>x*x,eB=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const cl=x=>Math.max(0,Math.min(1,x));
const rot=(p,c,a)=>{const r=a*Math.PI/180,x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*Math.cos(r)-y*Math.sin(r),c[1]+x*Math.sin(r)+y*Math.cos(r)]};
const sc=(p,c,k)=>[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k];
const lerp=(a,b,u)=>a.map((p,i)=>[p[0]+(b[i][0]-p[0])*u,p[1]+(b[i][1]-p[1])*u]);
function f4(t){const pv=[125,170];return four.map(st=>{if(t<.5)return st.s.map(p=>rot(p,pv,-28*eIn(t/.5)));const r=st.s.map(p=>rot(p,pv,-28));return lerp(r,st.e,eB((t-.5)/.5));});}
function f3(t){const c=[98,100],k=[.32,.08];return three.map((st,i)=>{if(t<.55)return st.s.map(p=>sc(p,c,1+k[i]*eQ(t/.55)));const r=st.s.map(p=>sc(p,c,1+k[i]));return lerp(r,st.e,eB((t-.55)/.45));});}
const d=pts=>"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
function mk(g,n,w,col){const a=[];for(let i=0;i<n;i++){const p=document.createElementNS(NS,"path");p.setAttribute("fill","none");p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");p.setAttribute("stroke-width",w);p.style.stroke=col;g.appendChild(p);a.push(p);}return a;}
const P0=mk(document.getElementById("p0"),3,7,"var(--ink)"),P1=mk(document.getElementById("p1"),2,7,"var(--ink)");
const g2=document.getElementById("p2"),g3=document.createElementNS(NS,"g"),g4=document.createElementNS(NS,"g");g2.appendChild(g3);g2.appendChild(g4);
const C3=mk(g3,2,4,"var(--muted)"),C4=mk(g4,3,8,"var(--ink)");
C4.forEach((p,i)=>p.setAttribute("d",d(four[i].e)));C3.forEach((p,i)=>p.setAttribute("d",d(three[i].e)));
function draw(T){f4(cl(T/.4)).forEach((x,i)=>P0[i].setAttribute("d",d(x)));f3(cl((T-.3)/.4)).forEach((x,i)=>P1[i].setAttribute("d",d(x)));const u=cl((T-.7)/.3),m=eIO(u);g2.style.opacity=u>0?1:.12;g4.setAttribute("transform","translate("+(-50*(1-m))+",0)");g3.setAttribute("transform","translate("+(50*(1-m))+",0)");document.getElementById("tl").textContent=Math.round(T*100)+"%";}
const sl=document.getElementById("t");sl.addEventListener("input",()=>{run=false;draw(sl.value/1000)});
let run=false,t0=0;
document.getElementById("play").addEventListener("click",()=>{run=true;t0=performance.now();requestAnimationFrame(step)});
function step(now){if(!run)return;const T=Math.min(1,(now-t0)/4500);sl.value=Math.round(T*1000);draw(T);if(T<1)requestAnimationFrame(step);else run=false;}
draw(0);
</script></body></html>
