<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 to sailboat</title>
<style>
:root{--ink:#1d1d1f;--muted:#8a8a8e;--bg:#ffffff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ink:#ececec;--muted:#77777c;--bg:#151517}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:2rem 1rem}
main{width:100%;max-width:420px}
.c{display:flex;gap:12px;align-items:center;margin-bottom:1rem}
input{flex:1}button{font:inherit;padding:6px 14px;border:1px solid var(--muted);background:none;color:var(--ink);border-radius:6px;cursor:pointer}
#tl{font-size:13px;color:var(--muted);min-width:150px}
</style><link rel="canonical" href="https://vmacedo.com/play/digits/sailboat.html"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head><body><main>
<div class="c"><button id="play">Play</button><input type="range" id="t" min="0" max="1000" value="0" aria-label="Timeline"><span id="tl"></span></div>
<svg viewBox="0 0 200 200" width="100%" role="img" aria-label="Digit 4 becoming a sailboat">
<path id="wave" fill="none" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--muted)" d="M8 176 Q 30 168 52 176 T 96 176 T 140 176 T 184 176"/>
<path id="fill" stroke="none" style="fill:var(--ink)"/><g id="g"></g></svg>
</main>
<script>
const N=48;
function resample(p,n){const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));const T=L[L.length-1],o=[];let j=1;for(let k=0;k<n;k++){const d=T*k/(n-1);while(j<p.length-1&&L[j]<d)j++;const s=L[j]-L[j-1]||1,u=(d-L[j-1])/s;o.push([p[j-1][0]+(p[j][0]-p[j-1][0])*u,p[j-1][1]+(p[j][1]-p[j-1][1])*u]);}return o;}
function quad(a,c,b){const o=[];for(let i=0;i<=40;i++){const t=i/40,m=1-t;o.push([m*m*a[0]+2*m*t*c[0]+t*t*b[0],m*m*a[1]+2*m*t*c[1]+t*t*b[1]]);}return o;}
const S=x=>resample(x,N);
const rot=(p,c,a)=>{const r=a*Math.PI/180,x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*Math.cos(r)-y*Math.sin(r),c[1]+x*Math.sin(r)+y*Math.cos(r)]};
const HC=[100,150],HEEL=-10;
// stroke order: mast, sail, boom, hull
const boat=[S([[110,28],[110,126]]),S(quad([110,28],[58,62],[44,122])),S([[44,124],[132,124]]),S([[178,132],[150,160],[55,160],[24,134]])].map(s=>s.map(p=>rot(p,HC,HEEL)));
// stroke order: upper stem, diagonal, crossbar, stem tail
const digit=[S([[125,40],[125,125]]),S([[125,40],[45,125]]),S([[45,125],[150,125]]),S([[125,125],[125,170]])];
const eIn=x=>x*x*x,eB=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const cl=x=>Math.max(0,Math.min(1,x));
const lerp=(a,b,u)=>a.map((p,i)=>[p[0]+(b[i][0]-p[0])*u,p[1]+(b[i][1]-p[1])*u]);
const d=pts=>"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
const g=document.getElementById("g"),P=[];
for(let i=0;i<4;i++){const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("fill","none");p.setAttribute("stroke-width","6");p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");p.style.stroke="var(--ink)";g.appendChild(p);P.push(p);}
const fillEl=document.getElementById("fill"),wave=document.getElementById("wave"),tl=document.getElementById("tl");
function frame(T){const pv=[125,170];let st;
 if(T<.35){const a=-18*eIn(T/.35);st=digit.map(s=>s.map(p=>rot(p,pv,a)));}
 else{const r=digit.map(s=>s.map(p=>rot(p,pv,-18))),u=eB(cl((T-.35)/.35));st=r.map((s,i)=>lerp(s,boat[i],u));}
 if(T>.7){const k=(T-.7)/.3,rock=4*Math.sin(k*Math.PI*2)*(1-k*.5);st=st.map(s=>s.map(p=>rot(p,HC,rock)));}
 return st;}
function draw(T){const st=frame(T);st.forEach((s,i)=>P[i].setAttribute("d",d(s)));
 fillEl.setAttribute("d",d(st[1].concat([st[0][N-1]]))+"Z");fillEl.style.fillOpacity=(0.12*cl((T-.45)/.3)).toFixed(3);
 wave.style.opacity=cl((T-.4)/.3).toFixed(2);
 tl.textContent=T<.35?"Wind heels the 4":T<.7?"Strokes become a boat":"Rest state";}
const sl=document.getElementById("t");sl.addEventListener("input",()=>{run=false;draw(sl.value/1000)});
let run=false,t0=0;
document.getElementById("play").addEventListener("click",()=>{run=true;t0=performance.now();requestAnimationFrame(step)});
function step(now){if(!run)return;const T=Math.min(1,(now-t0)/4000);sl.value=Math.round(T*1000);draw(T);if(T<1)requestAnimationFrame(step);else run=false;}
draw(0);
</script></body></html>
